user www-data;
worker_processes auto;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 768;
}

http {
    sendfile on;
    tcp_nopush on;
    types_hash_max_size 2048;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    gzip on;

    limit_req_status 429;
    limit_req_log_level warn;
    limit_conn_status 429;

    limit_req_zone $binary_remote_addr zone=md_auth:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=md_app:10m rate=30r/s;
    limit_conn_zone $binary_remote_addr zone=md_conn:10m;

    proxy_cache_path /var/cache/nginx/md_launcher levels=1:2 keys_zone=md_launcher:10m inactive=10m max_size=200m;

    include /etc/nginx/conf.d/*.conf;
    include /etc/nginx/sites-enabled/*;
}